<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8ff"><title>SHINE Preview</title><style>
:root{--ink:#10244b;--muted:#7183a2;--b:#176dff;--b2:#5bc4ff;--line:#d9e7fb;--shadow:0 18px 44px rgba(25,90,180,.14)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fbfdff,#f0f5ff);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,sans-serif;color:var(--ink)}button,input{font:inherit}.app{max-width:430px;margin:auto;min-height:100vh;padding-bottom:94px}
header{position:sticky;top:0;z-index:5;background:rgba(248,251,255,.9);backdrop-filter:blur(18px);padding:18px;border-bottom:1px solid #e2ebf8}.brand{display:flex;align-items:center;gap:12px}.orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 33% 26%,#fff 0 7%,#78ddff 14%,#2387ff 42%,#0957dc 78%);box-shadow:0 10px 25px #2787ff55;display:grid;place-items:center;color:#fff;font-size:26px}.brand b{font-size:24px;letter-spacing:.2em}.brand small{display:block;color:#7c8da9;letter-spacing:.18em;font-size:9px}
main{padding:18px}.hero{padding:12px 2px}.ey{font-size:11px;letter-spacing:.2em;color:#6f84a5;font-weight:800}.hero h1{font:600 40px/1.03 Georgia,serif;margin:9px 0}.hero p{color:var(--muted);font-size:17px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:142px;border:1px solid #fff;border-radius:27px;padding:18px;text-align:left;background:linear-gradient(135deg,#fff,#dceeff);box-shadow:var(--shadow);position:relative;overflow:hidden}.tile:nth-child(3){background:linear-gradient(135deg,#fff,#e5dcff)}.tile strong{font-size:22px;line-height:1.05;max-width:120px;display:block}.ic{position:absolute;right:12px;bottom:12px;width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#fff,#c8e2ff);display:grid;place-items:center;font-size:29px;box-shadow:inset 0 1px #fff,0 10px 24px #397ed233}
.sec{font-size:21px;margin:26px 2px 10px}.card,.row,.offer,.tool{background:#ffffffde;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow);margin:10px 0}.row{display:flex;gap:12px;align-items:center}.rIc{width:46px;height:46px;border-radius:15px;background:#eaf4ff;display:grid;place-items:center;font-size:22px}.txt{flex:1}.txt span,.muted{color:var(--muted);font-size:13px}.progress{height:9px;background:#e8eef7;border-radius:8px;overflow:hidden;margin-top:7px}.bar{height:100%;background:linear-gradient(90deg,#55beff,#1166f0)}
.chat{padding-bottom:130px}.msg{display:flex;gap:9px;align-items:flex-start;margin:13px 0}.msg.u{justify-content:flex-end}.av{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#45c9ff 20%,#126cff 72%);display:grid;place-items:center;color:#fff}.bubble{max-width:82%;background:#fff;border:1px solid #e2eaf5;border-radius:21px;padding:14px 16px;line-height:1.45;box-shadow:0 8px 20px #245d9f11}.u .bubble{background:#e6f1ff}
.offer{background:linear-gradient(135deg,#fff,#e3f3ff 62%,#ebe3ff)}.offer h3,.tool h3{margin:7px 0}.actions{display:flex;gap:8px;margin-top:12px}.primary,.secondary{border:0;border-radius:16px;padding:11px 13px;font-weight:700}.primary{background:linear-gradient(145deg,#58bbff,#1265ee);color:white;flex:1}.secondary{background:#edf4ff;color:#48678f}
.compose{position:fixed;bottom:77px;left:50%;transform:translateX(-50%);width:min(430px,100%);padding:10px 16px;background:linear-gradient(transparent,#f5f8ff 40%)}.box{background:#fff;border:1px solid #dbe7f8;border-radius:24px;padding:9px;display:flex;gap:8px;box-shadow:0 12px 28px #286ac522}.box input{border:0;outline:0;flex:1;padding:8px}.send{width:45px;height:45px;border:0;border-radius:50%;color:#fff;background:linear-gradient(145deg,#59bdff,#1466ef);font-size:23px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:78px;background:#f7faffee;backdrop-filter:blur(18px);border-top:1px solid #dce7f5;display:flex;padding:8px 10px 12px}nav button{border:0;background:none;flex:1;color:#75839d;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button span{font-size:20px}nav button.on{color:#1067ef;font-weight:700}
.tools button{width:100%;text-align:left;border:0}.search{width:100%;padding:13px 14px;border:1px solid #d8e5f6;border-radius:17px;outline:0}.hidden{display:none}
</style></head><body><div class="app"><header><div class="brand"><div class="orb">✦</div><div><b>SHINE</b><small>YOUR EXECUTIVE COACH</small></div></div></header><main id="m"></main><nav>
<button class="on" data-r="home"><span>⌂</span>Home</button><button data-r="coach"><span>💬</span>Coach</button><button data-r="tools"><span>▱</span>Tools</button><button data-r="practice"><span>▶</span>Practice</button><button data-r="cases"><span>▣</span>Cases</button></nav></div><script>
const T=[["desc","DESC","Communication","Net ve saygılı sınırlar koymak için basit bir konuşma yapısı."],["influence","Influence Map","Influence","Kimi, hangi motivasyonla ve hangi sırada etkilemen gerektiğini netleştirir."],["interest","Interest vs Position","Influence","Söylenen talep ile asıl ihtiyacı ayırır."],["decision","Weighted Decision Matrix","Decision","Seçenekleri aynı kriterlerle kıyaslar."],["scenario","Scenario Planning","Strategy","Belirsizlik altında birkaç gelecek senaryosunu karşılaştırır."],["7s","McKinsey 7S","Strategy","Strateji, yapı, sistem ve yeteneklerin uyumunu inceler."],["ai","AI Transformation Readiness","AI","AI dönüşümü için liderlik, veri, süreç ve yetenek hazırlığını değerlendirir."],["ladder","Ladder of Inference","Communication","Gözlem ile varsayımı birbirinden ayırır."],["batna","BATNA","Negotiation","Anlaşma olmazsa en iyi alternatifini netleştirir."]];
let S=JSON.parse(localStorage.getItem("shine_live")||'{"r":"home","msgs":[],"tool":null,"step":0,"role":false,"cases":[]}'); const save=()=>localStorage.setItem("shine_live",JSON.stringify(S)); const e=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function home(){return '<div class="grid"><button class="tile" data-go="coach"><strong>Talk to Your Coach</strong><div class="ic">💬</div></button><button class="tile" data-go="tools"><strong>Business Tools</strong><div class="ic">▱</div></button><button class="tile" data-go="practice"><strong>Practice & Role Play</strong><div class="ic">▶</div></button><button class="tile" data-go="cases"><strong>Your Cases</strong><div class="ic">▣</div></button></div><h2 class="sec">Your Progress</h2><div class="card"><div class="row"><div class="rIc">◎</div><div class="txt"><b>Work on a real case</b><div class="progress"><div class="bar" style="width:35%"></div></div></div></div><div class="row"><div class="rIc">🔧</div><div class="txt"><b>Use a business tool</b><div class="progress"><div class="bar" style="width:20%"></div></div></div></div><div class="row"><div class="rIc">▶</div><div class="txt"><b>Do a role play</b><div class="progress"><div class="bar" style="width:15%"></div></div></div></div></div><h2 class="sec">Recommended for You</h2>'+T.slice(0,2).map(x=>'<button class="row" data-tool="'+x[0]+'"><div class="rIc">✦</div><div class="txt"><b>'+x[1]+'</b><span>'+x[3]+'</span></div>›</button>').join("")}
function rel(){let q=S.msgs.filter(x=>x.w==="u").slice(-4).map(x=>x.t.toLowerCase()).join(" "); if(/gece|mesai|müdür|patron|manager|late|after hours/.test(q))return T[0]; if(/ikna|board|stakeholder|cfo|ceo/.test(q))return T[1]; if(/itiraz|direnç|resist/.test(q))return T[2]; if(/yatırım|invest|karar|decision/.test(q))return T[3]; if(/dijital dönüşüm|digital transformation|ai dönüşüm/.test(q))return T[6]; if(/varsayım|arkamdan|assumption/.test(q))return T[7]; return null}
function offer(){let t=rel(),n=S.msgs.filter(x=>x.w==="u").length;if(!t||n<2||S.tool||S.role)return"";return '<div class="offer"><div class="ey">THIS MAY HELP</div><h3>'+t[1]+'</h3><p><b>Ne işe yarar?</b> '+t[3]+'</p><p><b>Neden şimdi?</b> Bu konuşmada aynı problemi sadece tavsiyeyle değil, bir çerçeve üzerinden netleştirmek faydalı olabilir.</p><p class="muted">Bu frameworkü bilmen gerekmiyor. SHINE seni adım adım yönlendirecek.</p><div class="actions"><button class="primary" data-use="'+t[0]+'">Birlikte kullanalım</button><button class="secondary" data-no>Şimdilik konuş</button></div></div>'}
function toolbox(){if(!S.tool)return"";let t=T.find(x=>x[0]===S.tool),qs={desc:["Son somut olayı netleştirelim. En son ne istedi ve saat kaçtı?","Bu davranışın sana etkisi ne oldu?","Ondan net olarak neyin değişmesini istiyorsun?"],influence:["Kimi ikna etmen gerekiyor?","Bu kişinin asıl kaygısı ne?","Onu yanına çekmek için en güçlü kanıtın ne?"]},a=qs[S.tool]||["Bu toolu hangi gerçek duruma uygulamak istiyorsun?","Burada en önemli gerçek nedir?","Buradan hangi kararı çıkarmak istiyorsun?"];return '<div class="tool"><div class="ey">WORKING THROUGH '+t[1].toUpperCase()+'</div><h3>'+a[Math.min(S.step,a.length-1)]+'</h3><p class="muted">Tek adımda ilerliyoruz. Cevabını aşağıya yaz.</p></div>'}
function rolebox(){if(S.role)return '<div class="offer"><div class="ey">ROLE PLAY</div><h3>Ben karşı tarafım</h3><p>Gerçek görüşmedeki gibi cevap ver.</p><div class="actions"><button class="secondary" data-pause>Pause & Coach Me</button><button class="secondary" data-end>End & Review</button></div></div>'; if(S.msgs.filter(x=>x.w==="u").length>=3&&!S.tool&&!rel())return '<div class="offer"><h3>Practice this conversation?</h3><p>İstersen karşı taraf olayım ve gerçek görüşmeyi prova edelim.</p><div class="actions"><button class="primary" data-role>Yes, role play</button><button class="secondary" data-role-no>Not now</button></div></div>';return""}
function coach(){return '<div class="hero"><div class="ey">YOUR PRIVATE WORK COACH</div><h1>What’s on your mind?</h1><p>Önce anlamaya çalışacağım. Sonra gerektiğinde tool veya practice önereceğim.</p></div><div class="chat">'+(S.msgs.length?S.msgs.map(x=>'<div class="msg '+(x.w==="u"?"u":"")+'>'+(x.w==="a"?'<div class="av">✦</div>':'')+'<div class="bubble">'+e(x.t)+'</div></div>').join(""):'<div class="card muted">Try: “Müdürüm gece bile iş istiyor ve artık çok yoruldum.”</div>')+toolbox()+offer()+rolebox()+'</div><div class="compose"><div class="box"><input id="inp" placeholder="'+(S.role?"Role play cevabını yaz...":"Keep talking...")+'"><button class="send" id="send">↗</button></div></div>'}
function reply(t){let l=t.toLowerCase(),n=S.msgs.filter(x=>x.w==="u").length;if(S.role)return /gece|mesai|müdür|manager/.test(S.msgs.map(x=>x.t.toLowerCase()).join(" "))?"Bu raporu yarın sabah istiyorum. Ekipte herkes gerektiğinde ekstra çalışıyor. Neden bunu bu kadar büyütüyorsun?":"Peki, ama benim açımdan bu o kadar basit değil. Beni ikna etmek için ne söylemek istersin?";if(S.tool){S.step++;if(S.step>2){let tt=T.find(x=>x[0]===S.tool);S.tool=null;S.step=0;return "Buradan çıkan ana fikir netleşti. Şimdi bunu gerçek konuşmada nasıl kullanacağını hazırlayabiliriz."}return"Tamam. Bunu not ettim. Bir sonraki adıma geçelim."}if(n===1)return"Önce durumu biraz anlayayım. Seni bu konuda en çok zorlayan şey ne?";if(/gece|mesai|acil|müdür|patron|manager/.test(l))return"Bu tek seferlik bir yoğunluk mu, yoksa onun normal çalışma tarzı mı?";if(/board|yatırım|invest/.test(l))return"Boardu ikna etmekten önce yatırımın hangi sonucu yaratacağını netleştirelim. 12 ay sonra ne değişmiş olmalı?";if(/dijital dönüşüm|digital/.test(l))return"Bunu teknoloji projesi gibi ele almak istemiyorum. Önce neyi değiştirmek istediğini netleştirelim: gelir, maliyet, hız veya yeni iş modeli mi?";return"Biraz daha açalım. Burada senin için asıl değişmesini istediğin şey ne?"}
function tools(){return '<div class="hero"><div class="ey">BUSINESS TOOLS</div><h1>Frameworks, when you want them.</h1><p>Tool seçmek zorunda değilsin. SHINE doğru anda önerebilir.</p></div><input id="q" class="search" placeholder="Search tools..."><div class="tools" id="tl">'+T.map(x=>'<button class="row" data-tool="'+x[0]+'"><div class="rIc">✦</div><div class="txt"><b>'+x[1]+'</b><span>'+x[3]+'</span></div>›</button>').join("")+'</div>'}
function practice(){return '<div class="hero"><div class="ey">PRACTICE</div><h1>Rehearse the moments that matter.</h1><p>Gerçek bir durumu getir, birlikte prova edelim.</p></div><button class="primary" data-go="coach">Start with a situation</button><div class="row"><div class="rIc">▶</div><div class="txt"><b>Work through a real scenario</b><span>Bring the situation exactly as it is.</span></div></div><div class="row"><div class="rIc">✦</div><div class="txt"><b>Get personalized feedback</b><span>Practice, pause, adjust and try again.</span></div></div>'}
function cases(){return '<div class="hero"><div class="ey">CASES</div><h1>Your conversations, over time.</h1><p>Meaningful work situations stay available here.</p></div>'+(S.cases.length?S.cases.map(c=>'<button class="row" data-case="'+c.id+'"><div class="rIc">▣</div><div class="txt"><b>'+e(c.title)+'</b><span>Continue this conversation</span></div>›</button>').join(""):'<div class="card muted">No saved cases yet.</div>')}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.r===S.r));document.getElementById("m").innerHTML=S.r==="home"?home():S.r==="coach"?coach():S.r==="tools"?tools():S.r==="practice"?practice():cases();bind()}
function bind(){document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.r=b.dataset.r;save();render()});document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.r=b.dataset.go;save();render()});document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{S.tool=b.dataset.tool;S.step=0;S.r="coach";save();render()});document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{S.tool=b.dataset.use;S.step=0;save();render()});document.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{S.msgs.push({w:"a",t:"Tamam. Framework kullanmadan devam edelim."});save();render()});let s=document.getElementById("send"),i=document.getElementById("inp");if(s)s.onclick=send;if(i)i.onkeydown=x=>{if(x.key==="Enter")send()};document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{S.role=true;S.msgs.push({w:"a",t:"Hazırım. Ben karşı tarafım. İlk cümleni söyle."});save();render()});document.querySelectorAll("[data-role-no]").forEach(b=>b.onclick=()=>{S.msgs.push({w:"a",t:"Tamam. Önce yaklaşımı netleştirelim."});save();render()});document.querySelectorAll("[data-pause]").forEach(b=>b.onclick=()=>{S.role=false;S.msgs.push({w:"a",t:"Burada kısa bir coaching notu: karşı tarafın itirazını cevaplamadan önce asıl kaygısını aç."});save();render()});document.querySelectorAll("[data-end]").forEach(b=>b.onclick=()=>{S.role=false;S.msgs.push({w:"a",t:"Debrief: niyetin netti. Bir sonraki denemede çözümü biraz daha geç getir."});save();render()});let q=document.getElementById("q");if(q)q.oninput=()=>{let z=q.value.toLowerCase();document.getElementById("tl").innerHTML=T.filter(x=>(x[1]+" "+x[3]).toLowerCase().includes(z)).map(x=>'<button class="row" data-tool="'+x[0]+'"><div class="rIc">✦</div><div class="txt"><b>'+x[1]+'</b><span>'+x[3]+'</span></div>›</button>').join("");bind()}}
function send(){let i=document.getElementById("inp"),t=i.value.trim();if(!t)return;S.msgs.push({w:"u",t});i.value="";S.msgs.push({w:"a",t:reply(t)});if(S.msgs.filter(x=>x.w==="u").length>=3&&S.msgs.length%6===0)S.cases.unshift({id:Date.now(),title:t.slice(0,48),msgs:[...S.msgs]});save();render();setTimeout(()=>scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),50)}
render();
</script></body></html>
